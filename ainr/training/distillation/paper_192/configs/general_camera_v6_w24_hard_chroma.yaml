project:
  name: scunet_mobile_distillation_general_camera_v6_w24_hard_chroma
  preprocessing_version: mixed_exact_hwc_v1_uhd_teacher_lp8_local128_snic_jpeg95_v3_targeted_iso_sampling_synthetic_camera_jpeg_linear_post_isp_covariance_v3
  seed: 20260728

data:
  cache_root: data/high_iso_targeted_synthetic/cache
  manifest: data/high_iso_targeted_synthetic/cache/manifest.json
  datasets: [midd, sidd, polyu_sony, nind, uhd_ll, snic_sony, synthetic_camera_jpeg]
  source_preprocessing:
    legacy: exact_hwc_rgb_float_0_1_v1
    domain: exact_192_srgb_uhd_teacher_lp8_local128_snic_jpeg95_v3
    synthetic: synthetic_camera_jpeg_linear_post_isp_covariance_v3

teacher:
  repository: ../data/sources/scunet
  checkpoint: ../data/sources/scunet/model_zoo/scunet_color_real_psnr.pth
  checkpoint_name: scunet_color_real_psnr

model:
  base_width: 24
  expected_parameters: 4415643
  expected_conv_macs: 4443144192
  input_shape: [1, 3, 192, 192]

training:
  run_name: general_camera_v6_w24_hard_chroma
  epochs: 200
  batch_size: 8
  workers: 4
  samples_per_epoch: 12000
  learning_rate: 0.0001
  minimum_learning_rate: 0.000001
  optimizer: Adam
  amp: true
  gradient_clip_norm: 0.1
  checkpoint_interval: 10
  early_stopping_patience: null
  early_stopping_metric: target
  early_stopping_min_delta: 0.0001
  alpha: 0.7
  dataset_sampling_weights:
    midd: 0.15
    sidd: 0.08
    polyu_sony: 0.07
    nind: 0.10
    uhd_ll: 0.20
    snic_sony: 0.15
    synthetic_camera_jpeg: 0.25
  record_sampling:
    snic_sony:
      field: iso
      default: 1.0
      values:
        1600: 0.50
        3200: 0.75
        6400: 1.00
        12800: 2.00
    synthetic_camera_jpeg:
      field: iso
      default: 1.0
      values:
        12800: 0.50
        25600: 1.00
        51200: 1.50
  difficulty_sampling:
    enabled: true
    index: data/general_camera_v6_w24/difficulty_v5_chroma.json
    sha256: 1d35cda35dea2011391de9b67c06fbd8f1298e50c7a6f6c7f97100bcae8dd55b
    warmup_epochs: 20
    ramp_epochs: 40
    final_strength: 1.0
  selection_datasets: [midd, sidd, polyu_sony, nind, uhd_ll, snic_sony]
  correction_loss:
    enabled: true
    shadow_luminance_threshold: 0.25
    fine_sigma: 1.0
    medium_sigma: 4.0
    coarse_sigma: 12.0
    very_coarse_sigma: 24.0
    shadow_lambda: 10.0
    medium_coarse_lambda: 15.0
    normalized_shadow_lambda: 0.08
    normalized_shadow_chroma_lambda: 0.12
    shadow_medium_coarse_chroma_lambda: 20.0
    very_coarse_chroma_lambda: 20.0
    row_column_chroma_lambda: 5.0
    correction_magnitude_floor: 0.005
    correction_weight_reference: 0.02
    correction_weight_max: 2.0
    paired_detail_lambda: 7.5

target_validation:
  enabled: true
  datasets:
    nind: {}
    snic_sony:
      isos: [12800]
    uhd_ll: {}
  shadow_luminance_threshold: 0.25
  fine_sigma: 1.0
  medium_sigma: 4.0
  coarse_sigma: 12.0
  very_coarse_sigma: 24.0
  score_aggregation: mean_min
  minimum_metric_weight: 0.5
  score_metrics:
    - shadow_teacher_correction_capture
    - medium_coarse_teacher_correction_capture
    - shadow_chroma_teacher_correction_capture
    - medium_coarse_chroma_teacher_correction_capture
    - very_coarse_chroma_teacher_correction_capture
    - row_column_chroma_teacher_correction_capture
  minimum_general_selection_psnr: 36.5
  minimum_general_selection_ssim: 0.915
  minimum_shadow_teacher_correction_capture: 0.70
  minimum_medium_coarse_teacher_correction_capture: 0.77
  minimum_component_capture:
    shadow_chroma_teacher_correction_capture: 0.70
    medium_coarse_chroma_teacher_correction_capture: 0.78
    very_coarse_chroma_teacher_correction_capture: 0.45
    row_column_chroma_teacher_correction_capture: 0.42

metrics:
  border_crop: 1
  ssim_window_size: 11
  ssim_sigma: 1.5

outputs:
  runs: runs/general_camera_v6_w24
  evaluation: evaluation/general_camera_v6_w24
