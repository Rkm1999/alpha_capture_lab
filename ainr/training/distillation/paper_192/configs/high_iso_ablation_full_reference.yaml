project:
  name: scunet_mobile_distillation_nind_ablation
  preprocessing_version: exact_hwc_rgb_float_0_1_v1
  seed: 1337

data:
  cache_root: data/high_iso_ablation/cache
  manifest: data/high_iso_ablation/cache/manifest.json
  datasets: [midd, sidd, polyu_sony, nind]
  target_datasets: [polyu_sony, nind]

teacher:
  repository: ../data/sources/scunet
  checkpoint: ../data/sources/scunet/model_zoo/scunet_color_real_psnr.pth
  checkpoint_name: scunet_color_real_psnr

model:
  base_width: 16
  expected_parameters: 1963411
  expected_conv_macs: 1985347584
  input_shape: [1, 3, 192, 192]

training:
  epochs: 200
  batch_size: 16
  workers: 4
  learning_rate: 0.0001
  minimum_learning_rate: 0.00001
  optimizer: Adam
  amp: true
  gradient_clip_norm: 0.1
  checkpoint_interval: 10
  alpha: 0.7
  nind_gt_weight: 1.0
  selection_datasets: [midd, sidd, polyu_sony]

metrics:
  border_crop: 1
  ssim_window_size: 11
  ssim_sigma: 1.5

outputs:
  runs: runs/high_iso_ablation
  evaluation: evaluation/high_iso_ablation
