project:
  name: scunet_mobile_distillation_192
  preprocessing_version: exact_hwc_rgb_float_0_1_v1
  seed: 1337

data:
  source_manifest: ../data/extended_manifest.json
  source_root: ../data/sources
  cache_root: data/cache
  manifest: data/cache/manifest.json
  datasets:
    - midd
    - sidd
  target_datasets: []
  patches_per_pair:
    midd: 2
    sidd: 8
  validation_fraction: 0.15
  tile_size: 192
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotations: [0, 1, 2, 3]

teacher:
  repository: ../data/sources/scunet
  checkpoint: ../data/sources/scunet/model_zoo/scunet_color_real_psnr.pth
  checkpoint_name: scunet_color_real_psnr
  config: [4, 4, 4, 4, 4, 4, 4]
  dimension: 64
  cache_dtype: float16
  cache_inference_amp: false
  cache_batch_size: 4
  parity_samples: 8
  parity_maximum_absolute_error: 0.0005

model:
  base_width: 16
  expected_parameters: 1963411
  expected_conv_macs: 1985347584
  input_shape: [1, 3, 192, 192]

training:
  epochs: 200
  batch_size: 16
  workers: 4
  learning_rate: 0.0001
  minimum_learning_rate: 0.00001
  optimizer: Adam
  amp: true
  gradient_clip_norm: 0.1
  checkpoint_interval: 10
  alphas: [0.0, 0.7, 0.9]

metrics:
  border_crop: 1
  ssim_window_size: 11
  ssim_sigma: 1.5

outputs:
  runs: runs
  evaluation: evaluation
  export: export
