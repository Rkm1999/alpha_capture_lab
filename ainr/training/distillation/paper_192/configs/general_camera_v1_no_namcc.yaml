project:
  name: scunet_mobile_distillation_general_camera_v1_no_namcc
  preprocessing_version: general_camera_exact_192_rgb_paired_v1
  seed: 20260720

data:
  source_root: ../data/fresh_general_v1/verified
  source_manifest: ../data/fresh_general_v1/source_manifest.json
  cache_root: data/general_camera_v1_no_namcc/cache
  manifest: data/general_camera_v1_no_namcc/cache/manifest.json
  source_preprocessing:
    general: general_camera_exact_192_rgb_paired_v1
  # Continue with the available paired datasets after Real-NAID download issue.
  datasets: [polyu, renoir, midd]
  tile_size: 192
  crop_candidates: 64
  minimum_mask_valid_fraction: 0.9
  patches_per_pair:
    # Preserve crop diversity; the weighted sampler controls dataset balance.
    polyu: 16
    renoir: 8
    midd: 1
  alignment_gate:
    alignment_prefilter_sigma: 0.7
    alignment_search_radius: 3
    minimum_texture: 0.006
    minimum_zero_shift_correlation: 0.35
    maximum_nonzero_shift_gain: 0.035

teacher:
  repository: ../data/sources/scunet
  checkpoint: ../data/sources/scunet/model_zoo/scunet_color_real_psnr.pth
  checkpoint_name: scunet_color_real_psnr
  config: [4, 4, 4, 4, 4, 4, 4]
  dimension: 64
  cache_dtype: float16
  cache_inference_amp: false
  cache_batch_size: 4

model:
  base_width: 16
  expected_parameters: 1963411
  expected_conv_macs: 1985347584
  input_shape: [1, 3, 192, 192]

training:
  run_name: general_camera_v1_no_namcc
  epochs: 200
  batch_size: 16
  workers: 4
  samples_per_epoch: 12000
  learning_rate: 0.0001
  minimum_learning_rate: 0.00001
  optimizer: Adam
  amp: true
  gradient_clip_norm: 0.1
  checkpoint_interval: 10
  alpha: 0.7
  dataset_sampling_weights:
    # Equal probability per dataset, independent of cached patch counts.
    polyu: 0.3333333333333333
    renoir: 0.3333333333333333
    midd: 0.3333333333333334
  selection_datasets: [polyu, renoir, midd]
  correction_loss:
    enabled: true
    shadow_luminance_threshold: 0.25
    fine_sigma: 1.0
    medium_sigma: 4.0
    coarse_sigma: 12.0
    shadow_lambda: 10.0
    medium_coarse_lambda: 20.0
  early_stopping_metric: target
  # Set to null to train all epochs regardless of validation plateaus.
  early_stopping_patience: null
  early_stopping_min_delta: 0.003

target_validation:
  enabled: true
  datasets:
    polyu: {}
    renoir: {}
    midd: {}
  shadow_luminance_threshold: 0.25
  fine_sigma: 1.0
  medium_sigma: 4.0
  coarse_sigma: 12.0
  # Target-best checkpoints must retain paired-reference quality.
  minimum_general_selection_psnr: 38.70

metrics:
  border_crop: 1
  ssim_window_size: 11
  ssim_sigma: 1.5

outputs:
  runs: runs/general_camera_v1_no_namcc
  evaluation: evaluation/general_camera_v1_no_namcc
