project:
  name: scunet_mobile_distillation_general_camera_v75_w64_expansion_warmup
  preprocessing_version: mixed_exact_hwc_v1_uhd_teacher_lp8_local128_snic_jpeg95_v4_nind192_snic64_uhd16_targeted_iso_sampling_synthetic_camera_jpeg_linear_post_isp_covariance_v3
  seed: 20260726

data:
  cache_root: data/high_iso_targeted_synthetic_v9_nind192_snic64_uhd16/cache
  manifest: data/high_iso_targeted_synthetic_v9_nind192_snic64_uhd16/cache/manifest.json
  datasets: [midd, sidd, polyu_sony, nind, uhd_ll, snic_sony, synthetic_camera_jpeg]
  source_preprocessing:
    legacy: exact_hwc_rgb_float_0_1_v1
    domain: exact_192_srgb_uhd_teacher_lp8_local128_snic_jpeg95_v3
    synthetic: synthetic_camera_jpeg_linear_post_isp_covariance_v3

teacher:
  repository: ../data/sources/scunet
  checkpoint: ../data/sources/scunet/model_zoo/scunet_color_real_psnr.pth
  checkpoint_name: scunet_color_real_psnr

model:
  base_width: 64
  input_channels: 6
  noise_adapter_channels: 12
  multiscale_adapter_channels: 16
  multiscale_spatial_gate: true
  multiscale_chroma_floor: 0.20
  chroma_head_channels: 48
  chroma_head_spatial_floor: 1.0
  chroma_head_noise_floor: 1.0
  chroma_head_use_rgb: true
  chroma_head_dilations: [1, 2, 4, 8]
  global_chroma_head_channels: 64
  global_chroma_head_blocks: 5
  global_chroma_head_use_bottleneck: true
  chroma_unet_head_channels: 12
  chroma_profile_head_channels: 64
  noise_gate_start: 0.35
  noise_gate_end: 0.75
  expected_parameters: 33215259
  expected_conv_macs: 33901538304
  input_shape: [1, 6, 192, 192]
  noise_conditioning:
    enabled: true
    estimator: dark_flat_luma_mad_v1
    sigma_min: 0.0015
    sigma_max: 0.07
    shadow_luminance_limit: 0.5
    flat_fraction: 0.4
    jitter: 0.04
    dropout: 0.1
    gate_start: 0.35
    gate_end: 0.75
    gate_floor: 0.1
    validation_bucket_edges: [0.4, 0.7]
    spatial_maps:
      enabled: true
      shadow_luminance_limit: 0.5
      chroma_kernel_size: 9
      chroma_scale: 0.04

training:
  run_name: general_camera_v75_w64_expansion_warmup
  epochs: 40
  batch_size: 8
  workers: 4
  samples_per_epoch: 12000
  learning_rate: 0.00002
  minimum_learning_rate: 0.000001
  optimizer: Adam
  amp: true
  gradient_clip_norm: 0.1
  adapter_only_epochs: 0
  trainable_prefixes: []
  width_expansion_warmup_epochs: 60
  checkpoint_interval: 2
  early_stopping_patience: 20
  early_stopping_metric: target
  early_stopping_min_delta: 0.00001
  alpha: 1.0
  clean_l1_lambda: 0.0
  paired_kd_weight_override: 1.0
  dataset_sampling_weights:
    midd: 0.00625
    sidd: 0.00625
    polyu_sony: 0.00625
    nind: 0.325
    uhd_ll: 0.325
    snic_sony: 0.325
    synthetic_camera_jpeg: 0.00625
  scene_balanced_datasets: [nind, snic_sony]
  record_sampling:
    snic_sony:
      field: iso
      default: 1.0
      values:
        1600: 0.25
        3200: 0.45
        6400: 1.00
        12800: 3.0
    synthetic_camera_jpeg:
      field: iso
      default: 1.0
      values:
        12800: 0.35
        25600: 1.00
        51200: 2.0
  difficulty_sampling:
    enabled: false
    warmup_epochs: 0
    ramp_epochs: 1
    final_strength: 0.5
  selection_datasets: [midd, sidd, polyu_sony, nind, uhd_ll, snic_sony]
  correction_loss:
    enabled: true
    warmup_epochs: 0
    ramp_epochs: 2
    initial_scale: 1.0
    shadow_luminance_threshold: 0.25
    flat_gradient_threshold: 0.03
    fine_sigma: 1.0
    medium_sigma: 4.0
    coarse_sigma: 12.0
    very_coarse_sigma: 24.0
    shadow_lambda: 4.0
    medium_coarse_lambda: 4.0
    normalized_shadow_lambda: 0.5
    normalized_shadow_chroma_lambda: 0.5
    shadow_medium_coarse_chroma_lambda: 10.0
    flat_shadow_chroma_lambda: 0.0
    very_coarse_chroma_lambda: 0.0
    row_column_chroma_lambda: 0.0
    normalized_very_coarse_chroma_lambda: 6.0
    normalized_row_column_chroma_lambda: 1.5
    normalized_very_coarse_chroma_mse_lambda: 0.0
    normalized_row_column_chroma_mse_lambda: 0.0
    target_chroma_magnitude_floor: 0.0001
    pyramid_chroma_lambda: 10.0
    pyramid_chroma_scales: [1, 2, 4, 8, 16, 32]
    correction_magnitude_floor: 0.005
    correction_weight_reference: 0.02
    correction_weight_max: 2.0
    paired_detail_lambda: 0.0
    gate_start: 0.30
    gate_end: 0.70
    gate_floor: 0.15

target_validation:
  enabled: true
  datasets:
    nind: {}
    snic_sony:
      isos: [12800]
    uhd_ll: {}
  shadow_luminance_threshold: 0.25
  fine_sigma: 1.0
  medium_sigma: 4.0
  coarse_sigma: 12.0
  very_coarse_sigma: 24.0
  score_aggregation: mean_min
  minimum_metric_weight: 0.5
  score_metrics:
    - shadow_teacher_correction_capture
    - medium_coarse_teacher_correction_capture
    - shadow_chroma_teacher_correction_capture
    - medium_coarse_chroma_teacher_correction_capture
    - very_coarse_chroma_teacher_correction_capture
    - row_column_chroma_teacher_correction_capture
  minimum_general_selection_psnr: 34.60
  minimum_general_selection_ssim: 0.890
  minimum_component_capture:
    shadow_teacher_correction_capture: 0.82
    medium_coarse_teacher_correction_capture: 0.82
    shadow_chroma_teacher_correction_capture: 0.82
    medium_coarse_chroma_teacher_correction_capture: 0.84

metrics:
  border_crop: 1
  ssim_window_size: 11
  ssim_sigma: 1.5

outputs:
  runs: runs/general_camera_v15_chroma
  evaluation: evaluation/general_camera_v15_chroma
