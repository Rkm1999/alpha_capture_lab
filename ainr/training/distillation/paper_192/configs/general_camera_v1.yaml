project:
  name: scunet_mobile_distillation_general_camera_v1
  preprocessing_version: general_camera_exact_192_rgb_paired_v1
  seed: 20260720

data:
  source_root: ../data/fresh_general_v1/verified
  source_manifest: ../data/fresh_general_v1/source_manifest.json
  cache_root: data/general_camera_v1/cache
  manifest: data/general_camera_v1/cache/manifest.json
  source_preprocessing:
    general: general_camera_exact_192_rgb_paired_v1
  datasets: [polyu, renoir, midd, nam_cc]
  tile_size: 192
  crop_candidates: 64
  minimum_mask_valid_fraction: 0.98
  patches_per_pair:
    polyu: 16
    renoir: 8
    midd: 1
    nam_cc: 24
  alignment_gate:
    alignment_prefilter_sigma: 0.7
    alignment_search_radius: 3
    minimum_texture: 0.006
    minimum_zero_shift_correlation: 0.35
    maximum_nonzero_shift_gain: 0.035

teacher:
  repository: ../data/sources/scunet
  checkpoint: ../data/sources/scunet/model_zoo/scunet_color_real_psnr.pth
  checkpoint_name: scunet_color_real_psnr
  config: [4, 4, 4, 4, 4, 4, 4]
  dimension: 64
  cache_dtype: float16
  cache_inference_amp: false
  cache_batch_size: 4

model:
  base_width: 16
  expected_parameters: 1963411
  expected_conv_macs: 1985347584
  input_shape: [1, 3, 192, 192]

training:
  run_name: general_camera_v1_fresh
  epochs: 200
  batch_size: 16
  workers: 4
  samples_per_epoch: 12000
  learning_rate: 0.0001
  minimum_learning_rate: 0.00001
  optimizer: Adam
  amp: true
  gradient_clip_norm: 0.1
  checkpoint_interval: 10
  alpha: 0.7
  dataset_sampling_weights:
    polyu: 0.277
    renoir: 0.308
    midd: 0.338
    nam_cc: 0.077
  selection_datasets: [polyu, renoir, midd, nam_cc]
  early_stopping_metric: general
  early_stopping_patience: 30
  early_stopping_min_delta: 0.003

metrics:
  border_crop: 1
  ssim_window_size: 11
  ssim_sigma: 1.5

outputs:
  runs: runs/general_camera_v1
  evaluation: evaluation/general_camera_v1
