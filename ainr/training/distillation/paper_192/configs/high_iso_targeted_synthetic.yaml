project:
  name: scunet_mobile_distillation_high_iso_targeted_synthetic
  preprocessing_version: mixed_exact_hwc_v1_uhd_teacher_lp8_local128_snic_jpeg95_v3_targeted_iso_sampling_synthetic_camera_jpeg_linear_post_isp_covariance_v3
  seed: 20260719

data:
  cache_root: data/high_iso_targeted_synthetic/cache
  manifest: data/high_iso_targeted_synthetic/cache/manifest.json
  datasets: [midd, sidd, polyu_sony, nind, uhd_ll, snic_sony, synthetic_camera_jpeg]
  source_preprocessing:
    legacy: exact_hwc_rgb_float_0_1_v1
    domain: exact_192_srgb_uhd_teacher_lp8_local128_snic_jpeg95_v3
    synthetic: synthetic_camera_jpeg_linear_post_isp_covariance_v3

teacher:
  repository: ../data/sources/scunet
  checkpoint: ../data/sources/scunet/model_zoo/scunet_color_real_psnr.pth
  checkpoint_name: scunet_color_real_psnr

model:
  base_width: 16
  expected_parameters: 1963411
  expected_conv_macs: 1985347584
  input_shape: [1, 3, 192, 192]

training:
  run_name: high_iso_targeted_synthetic
  epochs: 40
  batch_size: 16
  workers: 4
  samples_per_epoch: 6400
  learning_rate: 0.000005
  minimum_learning_rate: 0.000001
  optimizer: Adam
  amp: true
  gradient_clip_norm: 0.1
  checkpoint_interval: 5
  early_stopping_patience: 8
  early_stopping_metric: target
  early_stopping_min_delta: 0.002
  alpha: 0.7
  dataset_sampling_weights:
    midd: 0.132
    sidd: 0.132
    polyu_sony: 0.088
    nind: 0.088
    uhd_ll: 0.176
    snic_sony: 0.264
    synthetic_camera_jpeg: 0.12
  record_sampling:
    snic_sony:
      field: iso
      default: 1.0
      values:
        1600: 0.50
        3200: 0.75
        6400: 1.00
        12800: 2.00
  selection_datasets: [midd, sidd, polyu_sony, uhd_ll, snic_sony]

target_validation:
  enabled: true
  datasets:
    nind: {}
    snic_sony:
      isos: [12800]
  shadow_luminance_threshold: 0.25
  fine_sigma: 1.0
  medium_sigma: 4.0
  coarse_sigma: 12.0
  minimum_general_selection_psnr: 38.30

metrics:
  border_crop: 1
  ssim_window_size: 11
  ssim_sigma: 1.5

outputs:
  runs: runs/high_iso_targeted
  evaluation: evaluation/high_iso_targeted
